[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "business-foundry"
version = "0.1.0"
description = "An open operating foundation for starting, acquiring, and running a business."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "mcp>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "platformdirs>=4.3,<5"]
# The native desktop window. Not needed for the CLI, the web server or the main test suite;
# CI installs it in one separate job that runs tests/test_desktop.py.
desktop = ["pywebview>=6.2,<7", "platformdirs>=4.3,<5"]

[project.scripts]
foundry = "foundry.cli:main"

[project.gui-scripts]
# A windowed launcher: on Windows it opens without a console.
foundry-desktop = "foundry.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "decimal.Decimal", "D"]
